name: Pages docs (no rebuild)

# Republishes GitHub Pages from an EXISTING web-build artifact plus docs/privacy,
# so a docs-only change (privacy policy) can go live without rebuilding or
# changing a single byte of the game (directive 2026-09-02i item 2: main frozen
# at the packaged build until CrazyGames approves). Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id whose fliptide-web artifact is currently live on Pages"
        required: true
        default: "33609873394"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    name: Republish live web build + docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the live web build (fliptide-web artifact)
        uses: actions/download-artifact@v4
        with:
          name: fliptide-web
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dl
      - name: Assemble site = live build + docs/privacy
        run: |
          set -euo pipefail
          mkdir -p site
          unzip -q dl/fliptide-web.zip -d site
          mkdir -p site/privacy
          cp -r docs/privacy/. site/privacy/
          echo "game files (unchanged):"; (cd site && sha256sum index.html flutter_bootstrap.js main.dart.wasm main.dart.mjs main.dart.js version.json canvaskit/skwasm.wasm)
          echo "docs added:"; find site/privacy -type f
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
